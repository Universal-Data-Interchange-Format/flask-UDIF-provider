apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: app-ingress
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /
spec:
  rules:
  - host: udif-data-provider-api.clture.io
    http:
      paths:
      - path: /
        pathType: ImplementationSpecific
        backend:
          service:
            name: udif-data-provider-service
            port:
              number: 5000
      - path: /flower/*
        pathType: ImplementationSpecific
        backend:
          service:
            name: flower-service
            port:
              number: 5555