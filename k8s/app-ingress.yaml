apiVersion: extensions/v1beta1
kind: Ingress
metadata:
  name: app-ingress
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /
spec:
  rules:
  - http:
      paths:
        - backend:
            serviceName: udif-data-provider-service
            servicePort: 80
          path: /*
          pathType: ImplementationSpecific